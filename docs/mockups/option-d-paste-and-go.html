<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option D · Paste and Go</title>
<style>
:root{--f:-apple-system,"SF Pro Text",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--hi:rgba(255,255,255,.95);--mid:rgba(255,255,255,.6);--lo:rgba(255,255,255,.4);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:#0d0e11;color:var(--hi);font:13px var(--f);padding-top:18px;-webkit-font-smoothing:antialiased;user-select:none}
i{font-style:normal}
svg.g{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
kbd{font:600 10px/1 var(--f);color:var(--mid);background:rgba(255,255,255,.08);padding:3px 4px;border-radius:4px}

.cap{width:1380px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--lo)}
.cap b{color:var(--hi);font-weight:600}
.cap button{font:500 11.5px var(--f);color:var(--mid);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:5px 12px;margin-left:6px;cursor:pointer}
.cap button.on{background:rgba(255,255,255,.16);color:var(--hi)}

/* The lid fades out below the island so it reads as "top of the screen". */
.lid{width:1380px;margin:0 auto;padding:10px 10px 0;background:#000;border-radius:22px 22px 0 0;box-shadow:0 0 0 1px #2c2d31;-webkit-mask-image:linear-gradient(#000 84%,transparent)}
.desk{position:relative;height:620px;border-radius:12px 12px 0 0;overflow:hidden;background:radial-gradient(900px 500px at 12% 95%,rgba(96,122,178,.55),transparent 70%),radial-gradient(800px 480px at 88% 25%,rgba(84,104,150,.5),transparent 70%),radial-gradient(600px 400px at 60% 70%,rgba(128,112,168,.28),transparent 70%),linear-gradient(#1c2231,#283042 55%,#1f2533)}
.menu{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(10,14,24,.28);backdrop-filter:blur(20px);color:rgba(255,255,255,.9)}
.menu>span{display:flex;align-items:center;gap:18px}
.menu .b{font-weight:700}
.menu svg{width:17px;height:17px;stroke-width:1.8}
.notch{position:absolute;top:0;left:50%;width:220px;height:38px;margin-left:-110px;background:#000;border-radius:0 0 10px 10px;z-index:3}
.notch::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3446,#07080b 65%)}

.island{position:absolute;top:0;left:50%;width:760px;height:500px;margin-left:-380px;background:#000;border-radius:0 0 28px 28px;display:flex;flex-direction:column;z-index:2;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
/* Concave fillets so the top corners flow into the bezel like the real notch. */
.island::before,.island::after{content:"";position:absolute;top:0;width:10px;height:10px}
.island::before{left:-10px;background:radial-gradient(circle at 0 100%,transparent 9.5px,#000 10px)}
.island::after{right:-10px;background:radial-gradient(circle at 100% 100%,transparent 9.5px,#000 10px)}

.hdr{height:38px;flex:none;display:flex}
.side{width:270px;display:flex;align-items:center;gap:4px}
.side.l{padding-left:14px}
.side.r{justify-content:flex-end;padding-right:18px;gap:8px}
.gap{width:220px;flex:none}
.tab{height:24px;display:flex;align-items:center;gap:6px;padding:0 7px 0 3px;border-radius:12px;color:var(--lo);font-size:11.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{background:rgba(255,255,255,.06)}
.tab.sel{background:rgba(255,255,255,.16);color:var(--hi)}
.tab:not(.sel) kbd{color:var(--lo)}
.clock{font-size:12px;font-weight:500;color:var(--mid);font-variant-numeric:tabular-nums}
.ka{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--mid)}
.sw{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.2);position:relative}
.sw::after{content:"";position:absolute;left:1px;top:1px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}

.bd{width:var(--z);height:var(--z);flex:none;border-radius:calc(var(--z)*.3);background:linear-gradient(var(--a),var(--b));display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.bd svg{width:60%;height:60%}
.ai{width:var(--z);height:var(--z);flex:none;border-radius:calc(var(--z)*.23);background:linear-gradient(var(--a),var(--b));display:grid;place-items:center;font-weight:600;font-size:calc(var(--z)*.5);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 1px 2px rgba(0,0,0,.4)}

.search{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;font-size:15px;color:var(--lo)}
.search svg{width:15px;height:15px;stroke:var(--lo)}
.caret{width:1.5px;height:18px;margin-right:-8px;background:var(--hi);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:6px;padding:0 18px 10px;flex:none}
.chip{height:22px;padding:0 10px;border-radius:11px;display:flex;align-items:center;font-size:11.5px;font-weight:500;color:var(--mid);background:rgba(255,255,255,.06);cursor:pointer}
.chip:hover{background:rgba(255,255,255,.1)}
.chip.sel{background:rgba(255,255,255,.16);color:var(--hi)}
.hr{height:1px;flex:none;background:var(--line)}
.vr{width:1px;flex:none;background:var(--line)}
.body{flex:1;min-height:0;display:flex}
.body.go{flex-direction:column}

.list{width:300px;flex:none;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:1px;scrollbar-width:none}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.08)}
.row.sel{background:rgba(255,255,255,.14)}
.tx{flex:1;min-width:0}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;color:var(--lo);margin-top:2px}
.mono{font-family:var(--mono);font-size:12px}
.row .ai{opacity:.85}
.kw{font-family:var(--mono);font-weight:500;font-size:10.5px}
.th{position:relative;width:24px;height:24px;flex:none}
.th .art{width:100%;height:100%;border-radius:6px}
.th .bd{position:absolute;right:-4px;bottom:-4px;box-shadow:0 0 0 1.5px #000}

.pv{flex:1;min-width:0;display:flex;flex-direction:column}
.pc{flex:1;min-height:0;overflow:auto;padding:16px;line-height:1.5}
.ptx{white-space:pre-wrap}
.ptx.mono{font-size:12.5px;white-space:pre;line-height:1.6}
.host{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mid);margin-bottom:10px}
.host svg{width:14px;height:14px;stroke:var(--mid);stroke-width:1.8}
.tok{color:#FFAD59;background:rgba(255,173,89,.14);border-radius:4px;padding:0 3px}
.pimg{height:100%;display:grid;place-items:center}
.pimg .art{width:100%;aspect-ratio:1.54;border-radius:8px}
.meta{height:30px;flex:none;border-top:1px solid var(--line);padding:0 16px;display:flex;align-items:center;font-size:10.5px;font-weight:500;color:var(--lo);white-space:nowrap;overflow:hidden}

/* Fake screenshot: a window on a wallpaper, all in percent so it scales from 24 px to full size. */
.art{position:relative;overflow:hidden;background:var(--bg)}
.art .w{position:absolute;left:8%;right:8%;top:10%;bottom:-4%;background:var(--w);border-radius:2.5%/4%;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.art b,.art u{position:absolute}
.art .bar{left:0;right:0;top:0;height:9%;background:rgba(128,128,128,.16)}
.art u{left:2.5%;top:28%;height:44%;aspect-ratio:4;background:radial-gradient(circle closest-side,#ff5f57 70%,transparent 80%) 0 0/25% 100% no-repeat,radial-gradient(circle closest-side,#febc2e 70%,transparent 80%) 50% 0/25% 100% no-repeat,radial-gradient(circle closest-side,#28c840 70%,transparent 80%) 100% 0/25% 100% no-repeat}
.art .sd{left:0;top:9%;bottom:0;width:22%;background:rgba(128,128,128,.1)}
.art .l1{left:28%;top:17%;width:40%;height:4.5%;border-radius:99px;background:rgba(128,128,128,.5)}
.art .l2{left:28%;top:26%;width:56%;height:3%;border-radius:99px;background:rgba(128,128,128,.28)}
.art .cd{left:28%;top:36%;width:64%;height:46%;border-radius:3%/5%;background:linear-gradient(135deg,var(--acc),transparent 150%)}
/* A plain artboard, no window frame, so exported images do not read as screenshots. */
.plain .bar,.plain .sd{display:none}
.art.plain .w{bottom:10%;border-radius:3%/5%}
.plain .l1,.plain .l2,.plain .cd{left:8%}
.plain .cd{width:84%;top:38%;height:52%}

.band{height:232px;flex:none;display:flex}
.grp{flex:1;min-width:0;padding:10px 12px}
.gt{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--lo);padding:0 0 4px 6px}
.grid{display:grid;gap:4px 6px}
.c4{grid-template-columns:repeat(4,1fr)}
.c6{grid-template-columns:repeat(6,1fr)}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;cursor:pointer}
.tile:hover{background:rgba(255,255,255,.08)}
.tile.sel{background:rgba(255,255,255,.14)}
.tile i{font-size:11px;line-height:14px;color:var(--mid);text-align:center;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.c4 .tile i{height:28px}
.wpv{width:298px;flex:none;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.shotbox{flex:1;min-height:0;margin-bottom:7px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.07);display:grid;place-items:center}
.shotbox .art{width:100%;height:100%}
.wt{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws{font-size:11px;color:var(--lo)}

.ftr{height:36px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px}
.h{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--lo)}
.h kbd{font-size:10.5px;padding:2px 5px;background:rgba(255,255,255,.07)}
.h:first-child kbd{color:var(--hi)}
.fill{flex:1}
</style>

  {app: 'Notes', t: 'Release checklist', sub: 'Notes · window 1 of 1', acc: '#F2B90C'},
];
const RECENT = [['Finder', 'Running · no open windows'], ['Messages', 'Running · no open windows'], ['Music', 'Last used 2 h ago'],
  ['Calendar', 'Last used yesterday'], ['Preview', 'Last used yesterday'], ['System Settings', 'Last used Monday']].map(([app, sub]) => ({app, t: app, sub}));
const CHIPS = [['all', 'All'], ['text', 'Text'], ['link', 'Links'], ['img', 'Images'], ['shot', 'Screenshots'], ['dict', 'Dictations'], ['snip', 'Snippets']];
const KEYS = {paste: [['↩', 'Copy'], ['⌘↩', 'Paste to Slack'], ['⌘P', 'Pin'], ['⌘⌫', 'Delete'], ['⇥', 'Filter']],
  go: [['↩', 'Switch to window'], ['⌘↩', 'Open new'], ['↑↓←→', 'Move']]};
const S = {tab: 'paste', chip: 'all', sel: 0, go: 0};

const badge = (k, z) => `<span class="bd" style="--a:${KIND[k][0]};--b:${KIND[k][1]};--z:${z}px"><svg class="g"><use href="#k-${KIND[k][2]}"/></svg></span>`;
const icon = (name, z) => { const [a, b, l, c = '#fff'] = APP[name]; return `<span class="ai" style="--a:${a};--b:${b};--z:${z}px;color:${c}">${l}</span>`; };
const art = ([bg, w, acc, cls = '']) => `<div class="art ${cls}" style="--bg:${bg};--w:${w};--acc:${acc}"><i class="w"><b class="bar"><u></u></b><b class="sd"></b><b class="l1"></b><b class="l2"></b><b class="cd"></b></i></div>`;
const visible = () => ITEMS.filter(i => S.chip === 'all' || i.k === S.chip);

function row(it, n) {
  const lead = it.art ? `<span class="th">${art(it.art)}${badge(it.k, 13)}</span>` : badge(it.k, 24);
  const tail = it.kw ? `<kbd class="kw">${it.kw}</kbd>` : icon(it.app, 16);
  return `<div class="row${n === S.sel ? ' sel' : ''}" data-i="${n}">${lead}<div class="tx"><div class="t${it.code ? ' mono' : ''}">${it.t}</div><div class="st">${it.sub || it.app + ' · ' + it.ago}</div></div>${tail}</div>`;
}

function preview(it) {
  const text = (it.body || it.t).replace(/\{(\w+)\}/g, '<span class="tok">{$1}</span>');
  const host = it.host ? `<div class="host"><svg class="g"><use href="#k-globe"/></svg>${it.host}</div>` : '';
  const body = it.art ? `<div class="pimg">${art(it.art)}</div>` : `${host}<div class="ptx${it.code ? ' mono' : ''}">${text}</div>`;
  return `<div class="pc">${body}</div><div class="meta">${it.meta}</div>`;
}

function pasteBody() {
  const list = visible();
  return `<div class="list">${list.map(row).join('')}</div><div class="vr"></div><div class="pv">${preview(list[S.sel])}</div>`;
}

function goBody() {
  const g = [...WIN, ...RECENT][S.go];
  const tile = (x, n) => `<div class="tile${n === S.go ? ' sel' : ''}" data-g="${n}">${icon(x.app, 36)}<i>${x.acc ? x.app + ' — ' + x.t : x.app}</i></div>`;
  const shot = g.acc ? art([DESK, '#1b1c21', g.acc]) : icon(g.app, 56);
  return `<div class="band"><div class="grp"><div class="gt">Open windows</div><div class="grid c4">${WIN.map(tile).join('')}</div></div><div class="vr"></div>
    <div class="wpv"><div class="shotbox">${shot}</div><div class="wt">${g.t}</div><div class="ws">${g.sub}</div></div></div>
    <div class="hr"></div><div class="grp"><div class="gt">Apps · recently used</div><div class="grid c6">${RECENT.map((x, n) => tile(x, n + WIN.length)).join('')}</div></div>`;
}

function render() {
  const paste = S.tab === 'paste', body = $('#body');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('sel', t.dataset.tab === S.tab));
  document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === (paste ? 'paste,' + S.chip : 'go')));
  $('#ph').textContent = paste ? 'Search anything you can paste…' : 'Switch to a window or open an app…';
  $('#chips').hidden = !paste;
  $('#chips').innerHTML = CHIPS.map(([k, l]) => `<div class="chip${k === S.chip ? ' sel' : ''}" data-chip="${k}">${l}</div>`).join('');
  // Keep the list's scroll position so clicking a lower row does not jump.
  const keep = body.querySelector('.list')?.scrollTop;
  body.className = 'body ' + S.tab;
  body.innerHTML = paste ? pasteBody() : goBody();
  if (keep && body.querySelector('.list')) body.querySelector('.list').scrollTop = keep;
  body.querySelector('.sel')?.scrollIntoView({block: 'nearest'});
  $('#ftr').innerHTML = [...KEYS[S.tab], null, ['⎋', 'Close']].map(h => h ? `<span class="h"><kbd>${h[0]}</kbd>${h[1]}</span>` : '<span class="fill"></span>').join('');
}

const set = p => { Object.assign(S, p); render(); };

function move(key) {
  if (S.tab === 'paste') {
    if (key === 'ArrowUp') S.sel = Math.max(0, S.sel - 1);
    if (key === 'ArrowDown') S.sel = Math.min(visible().length - 1, S.sel + 1);
  } else if (key === 'ArrowLeft' || key === 'ArrowRight') {
    S.go = Math.min(WIN.length + RECENT.length - 1, Math.max(0, S.go + (key === 'ArrowRight' ? 1 : -1)));
  } else {
    // The two groups have different column counts, so pick the nearest tile in the next row by position.
    const rects = [...document.querySelectorAll('.tile')].map(t => t.getBoundingClientRect());
    const cur = rects[S.go], down = key === 'ArrowDown';
    let best = S.go, score = Infinity;
    rects.forEach((r, n) => {
      const dy = down ? r.top - cur.top : cur.top - r.top;
      const s = dy * 1000 + Math.abs(r.left + r.width / 2 - cur.left - cur.width / 2);
      if (dy > 4 && s < score) { score = s; best = n; }
    });
    S.go = best;
  }
  render();
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '1' || e.key === '2') set({tab: e.key === '1' ? 'paste' : 'go'});
  else if (e.key === 'Tab') {
    e.preventDefault();
    if (S.tab !== 'paste') return;
    const n = CHIPS.findIndex(c => c[0] === S.chip) + (e.shiftKey ? -1 : 1);
    set({chip: CHIPS[(n + CHIPS.length) % CHIPS.length][0], sel: 0});
  } else if (e.key.startsWith('Arrow')) { e.preventDefault(); move(e.key); }
});

addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-chip],[data-i],[data-g],[data-preset]');
  if (!el) return;
  const d = el.dataset;
  if (d.preset) { const [tab, chip = S.chip] = d.preset.split(','); return set({tab, chip, sel: 0, go: 0}); }
  set(d.tab ? {tab: d.tab} : d.chip ? {chip: d.chip, sel: 0} : d.i ? {sel: +d.i} : {go: +d.g});
});

render();
</script>
</body>
</html>
