name: MacBud
options:
  bundleIdPrefix: com.rangrik
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 797YU4KXW5
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MacBud:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacBud
        excludes: ["**/*.entitlements"]
      - path: Resources
    info:
      path: Sources/MacBud/Info.plist
      properties:
        CFBundleDisplayName: MacBud
        CFBundleName: MacBud
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 rangrik"
        NSAppleEventsUsageDescription: "MacBud never sends Apple Events; this text is required by the system."
        NSDesktopFolderUsageDescription: "MacBud reads screenshots saved to your Desktop so you can browse and copy them."
        NSDocumentsFolderUsageDescription: "MacBud reads screenshots from folders you configure."
        NSDownloadsFolderUsageDescription: "MacBud reads screenshots from folders you configure."
        CFBundleURLTypes:
          - CFBundleURLName: com.rangrik.macbud
            CFBundleURLSchemes: [macbud]
            CFBundleTypeRole: Viewer
    entitlements:
      path: Sources/MacBud/MacBud.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rangrik.macbud
        PRODUCT_NAME: MacBud
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        OTHER_SWIFT_FLAGS: "-warnings-as-errors -Xfrontend -warn-long-function-bodies=400"
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: ""
  MacBudTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacBudTests
    dependencies:
      - target: MacBud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rangrik.macbud.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacBud.app/Contents/MacOS/MacBud"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MacBud:
    build:
      targets:
        MacBud: all
        MacBudTests: [test]
    run:
      config: Debug
      environmentVariables:
        MACBUD_AUTOMATION: "1"
    test:
      config: Debug
      targets:
        - MacBudTests
      gatherCoverageData: false
